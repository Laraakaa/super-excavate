name: Tests

on:
  push:
  pull_request:

jobs:
  lua-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install Lua
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4

      - name: Run unit tests
        run: lua5.4 tests/run.lua
